name: Publiser på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Bygg invit.wasm
        working-directory: invit-rs
        run: cargo build --release --lib --target wasm32-unknown-unknown

      - name: Sett sammen nettstedet
        run: |
          mkdir -p site
          cp web/index.html web/main.js site/
          cp invit-rs/target/wasm32-unknown-unknown/release/invit.wasm site/
          cp DATA/HIGH_HPS.XM site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
